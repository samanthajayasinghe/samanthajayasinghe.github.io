baseURL = "https://samanthajayasinghe.github.io/"
title = "Samantha Jayasinghe"
theme = "PaperMod"
enableRobotsTXT = true
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false

DefaultContentLanguage = "en"

[pagination]
  pagerSize = 5

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    contentDir = "content/en"
    title = "Samantha Jayasinghe"
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/post/"
        weight = 20

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  env = "production"
  author = "Samantha Jayasinghe"
  description = "Senior Site Reliability Engineer and systems architect — designing, scaling, and hardening large Kubernetes / OpenShift platforms, and automating the software lifecycle with AI agents."
  keywords = ["SRE", "Kubernetes", "OpenShift", "Reliability", "Automation"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto" # light / dark toggle
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowShareButtons = false
  ShowWordCount = false
  mainSections = ["post"]

  [params.homeInfoParams]
    Title = "Hi, I'm Sam(antha) 👋"
    Content = """
Senior Site Reliability Engineer and systems architect — I design, scale, and
harden large Kubernetes / OpenShift platforms, and automate the software lifecycle
with AI agents. Into system design, reliability, and road cycling. Recent posts below.

<p id="gh-stats" aria-label="Samantha's GitHub stats" style="display:inline-flex;flex-wrap:wrap;gap:.6em;margin:0.8em 0;font-size:.9em">
  <noscript><a href="https://github.com/samanthajayasinghe">github.com/samanthajayasinghe</a></noscript>
</p>
<script>
(function () {
  var el = document.getElementById('gh-stats');
  if (!el) return;
  fetch('https://api.github.com/users/samanthajayasinghe')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (u) {
      var items = [
        ['followers', u.followers],
        ['public repos', u.public_repos]
      ];
      if (u.public_gists) items.push(['gists', u.public_gists]);
      el.innerHTML = items.map(function (i) {
        return '<a href="https://github.com/samanthajayasinghe?tab=' +
          (i[0] === 'followers' ? 'followers' : 'repositories') + '" ' +
          'style="text-decoration:none;margin-right:.4em">' +
          '<strong>' + i[1] + '</strong> ' + i[0] + '</a>';
      }).join('<span aria-hidden="true" style="opacity:.4">·</span>');
    })
    .catch(function () {
      el.innerHTML = '<a href="https://github.com/samanthajayasinghe" style="text-decoration:none">@samanthajayasinghe</a>';
    });
})();
</script>
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/samanthajayasinghe"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/samanthatec/"

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true

[markup.goldmark.renderer]
  unsafe = true # allow raw HTML in markdown (needed for the GitHub stats cards)
