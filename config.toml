baseURL = "https://samanthajayasinghe.github.io/"
languageCode = "en-us"
title = "Samantha Jayasinghe"
theme = ["ananke"]
resourceDir = "../resources"

DefaultContentLanguage = "en"
SectionPagesMenu = "main"
Paginate = 5
googleAnalytics = ""
enableRobotsTXT = true

[languages]
  [languages.en]
    title = "Samantha Jayasinghe"
    weight = 1
    contentDir = "content/en"
    # languageDirection = 'rtl' for Right-To-Left languages

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  text_color = ""
  author = "Samantha Jayasinghe"
  favicon = ""
  site_logo = ""
  description = "Site Reliability Engineer working on managed Kubernetes and OpenShift — notes on reliability, automation, and operating large fleets."
  # choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-black"
  recent_posts_number = 3

[[params.ananke_socials]]
name = "github"
url = "https://github.com/samanthajayasinghe"

