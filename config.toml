baseURL = "https://samanthajayasinghe.github.io/"
title = "Samantha Jayasinghe"
theme = "PaperMod"
enableRobotsTXT = true
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false

DefaultContentLanguage = "en"

[pagination]
  pagerSize = 5

[languages]
  [languages.en]
    label = "English"
    locale = "en-us"
    weight = 1
    contentDir = "content/en"
    title = "Samantha Jayasinghe"
    [languages.en.menu]
      [[languages.en.menu.main]]
        identifier = "about"
        name = "About"
        url = "/about/"
        weight = 10
      [[languages.en.menu.main]]
        identifier = "posts"
        name = "Posts"
        url = "/post/"
        weight = 20

[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  env = "production"
  author = "Samantha Jayasinghe"
  description = "Site Reliability Engineer working on managed Kubernetes and OpenShift — notes on reliability, automation, and operating large fleets."
  keywords = ["SRE", "Kubernetes", "OpenShift", "Reliability", "Automation"]
  DateFormat = "January 2, 2006"
  defaultTheme = "auto" # light / dark toggle
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowShareButtons = false
  ShowWordCount = false
  mainSections = ["post"]

  [params.homeInfoParams]
    Title = "Hi, I'm Sam(antha) 👋"
    Content = """
Site Reliability Engineer focused on managed Kubernetes and OpenShift. I keep
large fleets healthy, automate operational toil, and make on-call less painful.

This site is where I collect notes and write-ups on reliability, automation, and
operating Kubernetes at scale. Recent posts are below.

<p>
  <a href="https://github.com/samanthajayasinghe">
    <picture>
      <source media="(prefers-color-scheme: dark)" srcset="https://github-readme-stats.vercel.app/api?username=samanthajayasinghe&show_icons=true&hide_border=true&theme=tokyonight&count_private=true">
      <img alt="Samantha's GitHub stats" src="https://github-readme-stats.vercel.app/api?username=samanthajayasinghe&show_icons=true&hide_border=true&count_private=true" height="150">
    </picture>
  </a>
</p>
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/samanthajayasinghe"

  # Add your LinkedIn by filling in the URL, then uncomment:
  # [[params.socialIcons]]
  #   name = "linkedin"
  #   url = "https://www.linkedin.com/in/your-handle"

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true

[markup.goldmark.renderer]
  unsafe = true # allow raw HTML in markdown (needed for the GitHub stats cards)
